
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شفاء | SHIFAA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="logo">
                <h1>شِفاء</h1>
                <span>SHIFAA</span>
            </div>

            <div class="welcome">
                <h2>مرحباً بدكتور المستقبل</h2>
                <p>
                    أهلاً بك في بوابة طلاب كلية الطب
                    <br>
                    جامعة سرت
                </p>
            </div>

            <div class="medical-message">
                <h3>أنتم سبب في الشفاء بعد الله</h3>
                <p>
                    رحلة العلم تبدأ بخطوة،
                    وبالإصرار نصنع مستقبلاً مليئاً بالأمل.
                </p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="username">اسم المستخدم</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="أدخل اسم المستخدم"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    تسجيل الدخول
                </button>

            </form>

            <div class="quote">
                <p>
                    "كل خطوة في طريق العلم
                    تقرّبنا من تحقيق الحلم"
                </p>
            </div>

            <footer>
                كلية الطب - جامعة سرت
                <br>
                <span>SHIFAA © 2026</span>
            </footer>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
